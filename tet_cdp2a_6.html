<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TET CDP Quiz — Q501-630</title>
<style>
:root{
  --bg:#f6f5f2; --card:#ffffff; --ink:#1f2430; --muted:#6b7280;
  --accent:#7c5cff; --accent2:#22b8a3; --good:#1e9e6d; --bad:#e0525a;
  --border:#e7e5e0; --shadow:0 8px 30px rgba(20,20,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15171f; --card:#1e2130; --ink:#eef0f6; --muted:#9aa1b4;
    --border:#2b2f42; --shadow:0 8px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#15171f; --card:#1e2130; --ink:#eef0f6; --muted:#9aa1b4;
  --border:#2b2f42; --shadow:0 8px 30px rgba(0,0,0,.4);
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Segoe UI",system-ui,-apple-system,"Noto Sans Telugu",sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
header{
  position:sticky; top:0; top:env(safe-area-inset-top,0px);
  background:var(--bg); z-index:5; padding:14px 16px 10px; margin:0 -16px 10px;
  border-bottom:1px solid var(--border);
}
h1{font-size:1.05rem; margin:0 0 4px; font-weight:700; letter-spacing:.2px;}
.sub{color:var(--muted); font-size:.82rem;}
.progress-bar{height:6px; background:var(--border); border-radius:99px; margin-top:10px; overflow:hidden;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); width:0%; transition:width .3s;}
.toolbar{display:flex; gap:8px; margin-top:10px; align-items:center; flex-wrap:wrap;}
.lang-toggle{display:inline-flex; border:1px solid var(--border); border-radius:99px; overflow:hidden;}
.lang-toggle button{
  border:none; background:transparent; color:var(--muted); padding:6px 14px; font-size:.8rem;
  font-weight:600; cursor:pointer;
}
.lang-toggle button.active{background:var(--accent); color:#fff;}
.pill{font-size:.75rem; color:var(--muted); background:var(--card); border:1px solid var(--border); border-radius:99px; padding:5px 10px;}
.jump{margin-left:auto; display:flex; gap:6px; align-items:center;}
.jump input{width:56px; padding:5px 6px; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--ink); font-size:.8rem;}
.jump button{border:1px solid var(--border); background:var(--card); color:var(--ink); border-radius:8px; padding:5px 10px; font-size:.78rem; cursor:pointer;}

.card{
  background:var(--card); border:1px solid var(--border); border-radius:18px;
  box-shadow:var(--shadow); padding:20px 18px; margin-bottom:16px;
}
.qmeta{display:flex; justify-content:space-between; color:var(--muted); font-size:.78rem; margin-bottom:8px;}
.stem{font-size:1.08rem; font-weight:600; line-height:1.5; margin-bottom:16px;}
.stem .te{font-weight:500; color:var(--muted); font-size:.95rem; display:block; margin-top:4px;}
.opts{display:flex; flex-direction:column; gap:10px;}
.opt{
  display:flex; align-items:flex-start; gap:10px; padding:12px 14px; border-radius:12px;
  border:1.5px solid var(--border); cursor:pointer; transition:.15s; background:transparent;
}
.opt:hover{border-color:var(--accent);}
.opt .letter{
  flex:0 0 24px; height:24px; border-radius:50%; border:1.5px solid var(--border);
  display:flex; align-items:center; justify-content:center; font-size:.75rem; font-weight:700; color:var(--muted);
}
.opt-text{flex:1;}
.opt-text .te{display:block; color:var(--muted); font-size:.86rem; margin-top:2px;}
.opt.selected{border-color:var(--accent);}
.opt.selected .letter{background:var(--accent); border-color:var(--accent); color:#fff;}
.opt.correct{border-color:var(--good); background:rgba(30,158,109,.08);}
.opt.correct .letter{background:var(--good); border-color:var(--good); color:#fff;}
.opt.wrong{border-color:var(--bad); background:rgba(224,82,90,.08);}
.opt.wrong .letter{background:var(--bad); border-color:var(--bad); color:#fff;}
.opt.disabled{cursor:default;}

.navrow{display:flex; gap:10px; margin-top:6px;}
.btn{
  flex:1; padding:12px; border-radius:12px; border:none; font-weight:700; font-size:.9rem; cursor:pointer;
}
.btn-primary{background:var(--accent); color:#fff;}
.btn-secondary{background:var(--card); color:var(--ink); border:1.5px solid var(--border);}
.btn:disabled{opacity:.4; cursor:not-allowed;}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(38px,1fr)); gap:6px; margin-top:10px;}
.gridbtn{
  aspect-ratio:1; border-radius:8px; border:1px solid var(--border); background:var(--card); color:var(--muted);
  font-size:.72rem; cursor:pointer; display:flex; align-items:center; justify-content:center;
}
.gridbtn.answered{background:var(--accent); color:#fff; border-color:var(--accent);}
.gridbtn.current{outline:2px solid var(--accent2); outline-offset:1px;}
.gridbtn.correctmark{background:var(--good); border-color:var(--good); color:#fff;}
.gridbtn.wrongmark{background:var(--bad); border-color:var(--bad); color:#fff;}

.result{text-align:center; padding:30px 16px;}
.result .score{font-size:2.4rem; font-weight:800; background:linear-gradient(90deg,var(--accent),var(--accent2)); -webkit-background-clip:text; background-clip:text; color:transparent;}
.hidden{display:none !important;}
footer{text-align:center; color:var(--muted); font-size:.72rem; margin-top:10px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>TET CDP Practice — Q501–630</h1>
    <div class="sub" id="subline">130 bilingual questions</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="toolbar">
      <div class="lang-toggle" id="langToggle">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="te">TE</button>
        <button data-lang="both">EN+TE</button>
      </div>
      <span class="pill" id="scorePill">Score: 0/0</span>
      <div class="jump">
        <input type="number" id="jumpInput" min="1" max="130" placeholder="#">
        <button id="jumpBtn">Go</button>
      </div>
    </div>
  </header>

  <div id="quizArea">
    <div class="card" id="qCard">
      <div class="qmeta"><span id="qIndex">Question 1 of 130</span><span id="qStatus"></span></div>
      <div class="stem" id="stemBox"></div>
      <div class="opts" id="optsBox"></div>
    </div>
    <div class="navrow">
      <button class="btn btn-secondary" id="prevBtn">◀ Prev</button>
      <button class="btn btn-primary" id="nextBtn">Next ▶</button>
    </div>
    <div class="grid" id="navGrid"></div>
  </div>

  <div class="card result hidden" id="resultCard">
    <div>Quiz complete</div>
    <div class="score" id="finalScore">0/130</div>
    <div class="sub" id="finalSub"></div>
    <div class="navrow" style="margin-top:16px;">
      <button class="btn btn-secondary" id="reviewBtn">Review answers</button>
      <button class="btn btn-primary" id="restartBtn">Restart quiz</button>
    </div>
  </div>

  <footer>Telugu Development & Psychology (CDP) — TET Practice Question Bank</footer>
</div>

<script>

let lang = 'en';
let current = 0;
let answers = new Array(DATA.length).fill(null);

const stemBox = document.getElementById('stemBox');
const optsBox = document.getElementById('optsBox');
const qIndex = document.getElementById('qIndex');
const qStatus = document.getElementById('qStatus');
const progressFill = document.getElementById('progressFill');
const scorePill = document.getElementById('scorePill');
const navGrid = document.getElementById('navGrid');
const quizArea = document.getElementById('quizArea');
const resultCard = document.getElementById('resultCard');

function answeredCount(){ return answers.filter(a=>a!==null).length; }
function correctCount(){ return answers.filter((a,i)=> a!==null && a===DATA[i].answer-1).length; }

function renderLangToggle(){
  document.querySelectorAll('#langToggle button').forEach(b=>{
    b.classList.toggle('active', b.dataset.lang===lang);
  });
}
document.getElementById('langToggle').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  lang = b.dataset.lang; renderLangToggle(); renderQuestion();
});

function textFor(en, te){
  if(lang==='en') return `<span class="en">${en}</span>`;
  if(lang==='te') return `<span class="te" style="display:inline;font-size:1em;color:inherit;">${te||en}</span>`;
  return `<span class="en">${en}</span>${te?`<span class="te">${te}</span>`:''}`;
}

function renderQuestion(){
  const q = DATA[current];
  qIndex.textContent = `Question ${current+1} of ${DATA.length}`;
  stemBox.innerHTML = textFor(q.en, q.te);
  optsBox.innerHTML = '';
  const picked = answers[current];
  const letters = ['A','B','C','D'];
  q.opts_en.forEach((optEn, idx)=>{
    const div = document.createElement('div');
    div.className = 'opt';
    let extra = '';
    if(picked!==null){
      div.classList.add('disabled');
      if(idx === q.answer-1) div.classList.add('correct');
      else if(idx === picked) div.classList.add('wrong');
    }
    if(picked===idx) div.classList.add('selected');
    div.innerHTML = `<div class="letter">${letters[idx]}</div><div class="opt-text">${textFor(optEn, q.opts_te[idx])}</div>`;
    div.addEventListener('click', ()=>{
      if(answers[current]!==null) return;
      answers[current] = idx;
      renderQuestion();
      renderGrid();
      updateHeader();
    });
    optsBox.appendChild(div);
  });
  qStatus.textContent = picked===null ? '' : (picked===q.answer-1 ? 'Correct ✓' : 'Incorrect ✕');
  document.getElementById('prevBtn').disabled = current===0;
  document.getElementById('nextBtn').textContent = current===DATA.length-1 ? 'Finish' : 'Next ▶';
}

function updateHeader(){
  progressFill.style.width = (answeredCount()/DATA.length*100)+'%';
  scorePill.textContent = `Score: ${correctCount()}/${answeredCount()}`;
}

function renderGrid(){
  navGrid.innerHTML = '';
  DATA.forEach((q,i)=>{
    const b = document.createElement('button');
    b.className = 'gridbtn';
    b.textContent = i+1;
    if(i===current) b.classList.add('current');
    if(answers[i]!==null){
      b.classList.add(answers[i]===q.answer-1 ? 'correctmark' : 'wrongmark');
    }
    b.addEventListener('click', ()=>{ current=i; renderQuestion(); renderGrid(); });
    navGrid.appendChild(b);
  });
}

document.getElementById('prevBtn').addEventListener('click', ()=>{
  if(current>0){ current--; renderQuestion(); renderGrid(); }
});
document.getElementById('nextBtn').addEventListener('click', ()=>{
  if(current<DATA.length-1){ current++; renderQuestion(); renderGrid(); }
  else { showResult(); }
});
document.getElementById('jumpBtn').addEventListener('click', ()=>{
  const v = parseInt(document.getElementById('jumpInput').value,10);
  if(v>=1 && v<=DATA.length){ current=v-1; renderQuestion(); renderGrid(); }
});

function showResult(){
  quizArea.classList.add('hidden');
  resultCard.classList.remove('hidden');
  document.getElementById('finalScore').textContent = `${correctCount()}/${DATA.length}`;
  const unanswered = DATA.length - answeredCount();
  document.getElementById('finalSub').textContent = unanswered>0 ? `${unanswered} question(s) left unanswered` : 'All questions answered';
}
document.getElementById('reviewBtn').addEventListener('click', ()=>{
  quizArea.classList.remove('hidden');
  resultCard.classList.add('hidden');
  current = 0; renderQuestion(); renderGrid();
});
document.getElementById('restartBtn').addEventListener('click', ()=>{
  answers = new Array(DATA.length).fill(null);
  current = 0;
  quizArea.classList.remove('hidden');
  resultCard.classList.add('hidden');
  renderQuestion(); renderGrid(); updateHeader();
});

renderQuestion();
renderGrid();
updateHeader();
</script>
</body>
</html>
